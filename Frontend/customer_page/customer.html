<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account</title>
  <link rel="icon" type="image/png" href="pictures/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Montserrat+Alternates:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="customer.css">
  <link rel="stylesheet" href="../shared/nav_bar.css">
</head>

<body>

  <div id="navbar-container"></div>

  <main id="page">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="../home_page/index.html">Home</a><span class="sep" aria-hidden="true">&gt;</span><span aria-current="page">My Account</span>
    </nav>
    <div class="acct">
      <section class="profile-card">
        <div class="cover" role="img" aria-label="Mithi cover banner"></div>
        <div class="who">
          <button type="button" class="pfp" id="pfpBtn" aria-label="Change profile photo">
            <img class="pfp-img" src="pictures/p.png" alt="Profile picture">
            <img class="cam" src="pictures/camera.png" alt="" data-fb="1" onerror="this.hidden=true">
          </button>
          <div class="who-text">
            <h1><span id="customerName">Lolong Chi</span><button type="button" class="edit-chip" id="editName"
                aria-controls="nameEditor" aria-expanded="false">&#9998; Edit</button></h1>
            <form class="name-editor" id="nameEditor" hidden>
              <label for="nameInput">Display name</label>
              <div class="name-editor-row">
                <input id="nameInput" type="text" maxlength="60" autocomplete="name" required>
                <button class="name-save" type="submit">Save</button>
                <button class="name-cancel" id="cancelName" type="button">Cancel</button>
              </div>
              <p class="name-error" id="nameError" aria-live="polite"></p>
            </form>
            <p class="handle">@thomas.norstein</p>
            <p class="uid">12345678912</p>
            <span class="vip"><img src="pictures/crown.png" alt=""><span>Vip Customer</span></span>
          </div>
        </div>

        <div class="cols">
          <div class="info-col">
            <h2 class="tab-title">Personal Information</h2>
            <div class="info-box">
              <div class="info-row"><div><small>Birthday</small>Jan 12, 2004</div><div><small>Customer since</small>May 6, 2026</div></div>
              <div class="info-row"><div><small>Phone</small>+63-900-000-0000</div><div><small>Email</small>mithiexample123456@gmail.com</div></div>
              <div class="info-row three"><div><small>Region</small>Zambales</div><div><small>City</small>Olongapo City</div><div><small>Zip Code</small>2200</div></div>
            </div>
          </div>
          <div class="wish-col">
            <h2 class="tab-title"><span class="heart">&#10084;</span> Wishlist(<span id="wishCount">52</span>)</h2>
            <div class="wish-list" id="wishList"></div>
          </div>
        </div>
      </section>

      <aside class="side-card" aria-label="Account menu">
        <div class="side-tabs" role="tablist">
          <button type="button" role="tab" class="on" aria-selected="true">My Account</button>
          <button type="button" role="tab" aria-selected="false">Billings</button>
        </div>
        <nav class="side-nav">
          <button type="button" class="s-item on" data-t="Home"><span class="ico" style="--i:url(pictures/home.svg)" aria-hidden="true"></span>Home</button>
          <button type="button" class="s-item" data-t="Delivery Status"><span class="ico" style="--i:url(pictures/truck.svg)" aria-hidden="true"></span>Delivery Status</button>
          <button type="button" class="s-item" data-t="Last viewed"><span class="ico" style="--i:url(pictures/view.svg)" aria-hidden="true"></span>Last viewed</button>
          <button type="button" class="s-item" data-t="Notification"><span class="ico" style="--i:url(pictures/notif.svg)" aria-hidden="true"></span>Notification</button>
          <div class="s-group">
          <button type="button" class="s-item" data-t="Settings"><span class="ico" style="--i:url(pictures/settings.svg)" aria-hidden="true"></span>Settings</button>
          <ul class="sub">
            <li><button type="button" data-t="My Profile">My Profile</button></li>
            <li><button type="button" data-t="Change Password">Change Password</button></li>
            <li><button type="button" data-t="Privacy Setting">Privacy Setting</button></li>
            <li><button type="button" data-t="Language and Region">Language and Region</button></li>
          </ul>
          </div>
          <div class="s-group">
          <button type="button" class="s-item mgmt" data-t="Account Management"><span class="ico" style="--i:url(pictures/account.svg)" aria-hidden="true"></span>Account Management</button>
          <ul class="sub">
            <li><button type="button" data-t="Switch Account">Switch Account</button></li>
            <li><button type="button" data-t="Log Out">Log Out</button></li>
            <li><button type="button" class="danger" data-t="Delete Account">Delete Account</button></li>
          </ul>
          </div>
          <button type="button" class="s-item" data-t="Help"><span class="ico" style="--i:url(pictures/help.svg)" aria-hidden="true"></span>Help</button>
        </nav>
      </aside>
    </div>
  </main>

  <script src="../shared/nav_bar.js"></script>
  <script src="customer.js"></script>
  <script src="../shared/nav_loader.js"></script>
  <script>
    /* Optional page hooks:
       onSearch = text => { ... }       runs when the search bar changes / is submitted
       onCategory = catKey => { ... }   runs when a category filter is picked ('' = none) */
  </script>
</body>

</html>
