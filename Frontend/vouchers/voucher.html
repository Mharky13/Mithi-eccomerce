<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mithi - Vouchers</title>
  <link rel="icon" type="image/png" href="pictures/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Montserrat+Alternates:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="voucher.css">
  <link rel="stylesheet" href="../shared/nav_bar.css">
</head>

<body>

  <div id="navbar-container"></div>

  <main id="page" class="voucher-page">
    <section class="v-hero">
      <h1>Vouchers mo, Sis</h1>
      <p>Claim discount coupons and enter promo codes to save big on your next order!</p>
    </section>

    <div class="v-tabs" id="voucherTabs" role="tablist">
      <button type="button" class="v-tab active" data-tab="available" role="tab" aria-selected="true">Available (2)</button>
      <button type="button" class="v-tab" data-tab="claimed" role="tab" aria-selected="false">Claimed (1)</button>
      <button type="button" class="v-tab" data-tab="spent" role="tab" aria-selected="false">Spent</button>
    </div>

    <section class="v-grid" id="voucherGrid" aria-live="polite"></section>
  </main>

  <script src="../shared/nav_bar.js"></script>
  <script src="voucher.js"></script>
  <script src="../shared/nav_loader.js"></script>
</body>

</html>
